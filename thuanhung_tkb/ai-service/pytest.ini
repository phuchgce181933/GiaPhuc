[pytest]
# The service package and the test helpers are both importable without
# an editable install, so the suite runs straight from a clone.
pythonpath = .
testpaths = tests
# `-p no:cacheprovider` is not set deliberately; a .pytest_cache
# directory is normal and belongs in .gitignore.
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
